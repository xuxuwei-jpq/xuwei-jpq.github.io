<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>许旭威 · 个人简历 · 科幻风</title>
    <style>
        /* ===== CSS Variables & Reset ===== */
        :root {
            --primary: #00d4ff;
            --primary-glow: rgba(0, 212, 255, 0.35);
            --secondary: #7c3aed;
            --secondary-glow: rgba(124, 58, 237, 0.35);
            --accent: #ec4899;
            --accent-glow: rgba(236, 72, 153, 0.30);
            --bg-deep: #080c1a;
            --bg-surface: rgba(16, 24, 48, 0.65);
            --bg-card: rgba(22, 32, 64, 0.70);
            --text-primary: #e8edff;
            --text-secondary: #9aa8d6;
            --text-muted: #6a7aaa;
            --border-glow: rgba(0, 212, 255, 0.20);
            --radius: 16px;
            --radius-sm: 10px;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            --font-mono: "SF Mono", "Fira Code", monospace;
            --max-width: 1160px;
            --nav-height: 64px;
            --shadow-glow: 0 8px 40px rgba(0, 212, 255, 0.08);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-deep);
            color: var(--text-primary);
            line-height: 1.6;
            padding-top: var(--nav-height);
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 20% 30%, rgba(0, 212, 255, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(124, 58, 237, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(236, 72, 153, 0.04) 0%, transparent 50%);
            background-attachment: fixed;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.25s ease;
        }
        a:hover {
            color: var(--accent);
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-deep);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
            box-shadow: 0 0 16px var(--primary-glow);
        }

        /* ===== Navigation ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            z-index: 1000;
            background: rgba(8, 12, 26, 0.78);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-bottom: 1px solid var(--border-glow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            transition: border-color 0.3s ease;
        }
        .navbar:hover {
            border-bottom-color: rgba(0, 212, 255, 0.35);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navbar-brand .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 0 20px var(--primary-glow);
            flex-shrink: 0;
            animation: pulse-dot 2.4s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.85);
            }
        }

        .navbar-links {
            display: flex;
            align-items: center;
            gap: 4px;
            list-style: none;
            flex-wrap: wrap;
        }
        .navbar-links a {
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.25s ease;
            position: relative;
            letter-spacing: 0.02em;
        }
        .navbar-links a::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: all 0.3s ease;
            transform: translateX(-50%);
            border-radius: 4px;
        }
        .navbar-links a:hover::after,
        .navbar-links a.active::after {
            width: 60%;
        }
        .navbar-links a:hover {
            color: var(--text-primary);
            background: rgba(0, 212, 255, 0.06);
        }
        .navbar-links a.active {
            color: var(--primary);
            background: rgba(0, 212, 255, 0.08);
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .navbar-actions button {
            background: transparent;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 1.05rem;
            transition: all 0.25s ease;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid transparent;
        }
        .navbar-actions button:hover {
            background: rgba(0, 212, 255, 0.10);
            color: var(--primary);
            border-color: var(--border-glow);
            box-shadow: 0 0 24px var(--primary-glow);
        }
        .navbar-actions button:active {
            transform: scale(0.92);
        }

        /* ===== Container ===== */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px 48px;
        }

        /* ===== Section ===== */
        .section {
            margin-top: 52px;
            animation: fadeUp 0.6s ease both;
        }
        .section:first-of-type {
            margin-top: 28px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 26px;
        }
        .section-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--text-primary), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
        }
        .section-header .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border-glow), transparent);
        }
        .section-header .badge-count {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 2px 14px;
            border-radius: 40px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            box-shadow: 0 0 24px var(--primary-glow);
        }

        /* ===== Hero ===== */
        .hero {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 36px;
            padding: 28px 0 8px;
            align-items: start;
        }
        .hero-main h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            background: linear-gradient(135deg, #fff 30%, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-main .subhead {
            font-size: 1.08rem;
            color: var(--text-secondary);
            margin-top: 6px;
            max-width: 540px;
        }
        .hero-main .subhead .highlight {
            color: var(--primary);
            font-weight: 600;
            -webkit-text-fill-color: var(--primary);
        }
        .hero-main .contact-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 24px;
            margin-top: 14px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .hero-main .contact-row a {
            color: var(--text-secondary);
            transition: color 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .hero-main .contact-row a:hover {
            color: var(--primary);
        }
        .hero-main .contact-row .copy-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 0.75rem;
            padding: 2px 10px;
            border-radius: 4px;
            transition: all 0.25s ease;
            border: 1px solid transparent;
        }
        .hero-main .contact-row .copy-btn:hover {
            color: var(--primary);
            border-color: var(--border-glow);
            background: rgba(0, 212, 255, 0.06);
        }

        .hero-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }
        .hero-tags .tag {
            padding: 4px 18px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            background: rgba(0, 212, 255, 0.06);
            border: 1px solid var(--border-glow);
            color: var(--text-secondary);
            transition: all 0.3s ease;
            letter-spacing: 0.02em;
            backdrop-filter: blur(4px);
        }
        .hero-tags .tag:hover {
            border-color: var(--primary);
            color: var(--text-primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 24px var(--primary-glow);
            background: rgba(0, 212, 255, 0.10);
        }
        .hero-tags .tag.highlight {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: transparent;
            color: #fff;
            box-shadow: 0 0 32px var(--primary-glow);
        }
        .hero-tags .tag.highlight:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 48px var(--primary-glow);
        }

        .hero-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.6rem;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 0 60px var(--primary-glow), 0 0 120px rgba(124, 58, 237, 0.15);
            user-select: none;
            border: 2px solid rgba(255, 255, 255, 0.08);
            animation: float-avatar 5s ease-in-out infinite;
        }
        @keyframes float-avatar {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        @media (max-width: 640px) {
            .hero {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .hero-avatar {
                width: 72px;
                height: 72px;
                font-size: 2rem;
                justify-self: start;
            }
            .hero-main h1 {
                font-size: 2.2rem;
            }
            .navbar-links a {
                padding: 4px 10px;
                font-size: 0.72rem;
            }
        }

        /* ===== Highlights ===== */
        .highlights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
        }
        .highlight-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 18px 16px;
            border: 1px solid var(--border-glow);
            transition: all 0.35s ease;
            text-align: center;
            backdrop-filter: blur(4px);
        }
        .highlight-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 40px var(--primary-glow), inset 0 0 40px rgba(0, 212, 255, 0.02);
            border-color: var(--primary);
        }
        .highlight-card .number {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        .highlight-card .label {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* ===== Tabs ===== */
        .tabs-wrapper {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-glow);
            overflow: hidden;
            transition: border-color 0.3s ease;
            backdrop-filter: blur(4px);
        }
        .tabs-wrapper:hover {
            border-color: rgba(0, 212, 255, 0.30);
        }

        .tabs-header {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border-glow);
            background: rgba(8, 12, 26, 0.40);
            overflow-x: auto;
            padding: 0 8px;
            scrollbar-width: none;
        }
        .tabs-header::-webkit-scrollbar {
            display: none;
        }
        .tabs-header button {
            flex: 0 0 auto;
            padding: 14px 22px;
            font-size: 0.85rem;
            font-weight: 600;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-family: var(--font-sans);
            position: relative;
        }
        .tabs-header button:hover {
            color: var(--text-primary);
            background: rgba(0, 212, 255, 0.04);
        }
        .tabs-header button[aria-selected="true"] {
            color: var(--primary);
            border-bottom-color: var(--primary);
            box-shadow: 0 4px 32px rgba(0, 212, 255, 0.06);
        }
        .tabs-header button .tab-badge {
            display: inline-block;
            font-size: 0.6rem;
            font-weight: 700;
            margin-left: 6px;
            padding: 0 8px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
        }
        .tabs-header button[aria-selected="true"] .tab-badge {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .tabs-panel {
            padding: 24px 28px;
            display: none;
            animation: fadeUp 0.35s ease both;
        }
        .tabs-panel[aria-hidden="false"] {
            display: block;
        }

        /* ===== Experience items ===== */
        .exp-item {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 16px 24px;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .exp-item:last-child {
            border-bottom: none;
        }
        .exp-item .exp-date {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            padding-top: 2px;
        }
        .exp-item .exp-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-primary);
        }
        .exp-item .exp-org {
            font-size: 0.88rem;
            color: var(--text-secondary);
        }
        .exp-item .exp-desc {
            font-size: 0.88rem;
            color: var(--text-secondary);
            margin-top: 4px;
            list-style: none;
            padding-left: 0;
        }
        .exp-item .exp-desc li {
            position: relative;
            padding-left: 18px;
            margin-top: 2px;
        }
        .exp-item .exp-desc li::before {
            content: "▸";
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: 700;
        }

        @media (max-width: 600px) {
            .exp-item {
                grid-template-columns: 1fr;
                gap: 4px;
            }
            .exp-item .exp-date {
                font-size: 0.72rem;
            }
            .tabs-panel {
                padding: 16px;
            }
        }

        /* ===== Project Cards ===== */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius-sm);
            padding: 20px 22px;
            transition: all 0.35s ease;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(4px);
        }
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 48px var(--primary-glow), inset 0 0 40px rgba(0, 212, 255, 0.02);
            border-color: var(--primary);
        }
        .project-card .proj-title {
            font-weight: 700;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }
        .project-card .proj-title .emoji {
            font-size: 1.2rem;
        }
        .project-card .proj-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
            margin: 8px 0 10px;
        }
        .project-card .proj-stack span {
            font-size: 0.65rem;
            font-weight: 500;
            padding: 2px 12px;
            border-radius: 40px;
            background: rgba(0, 212, 255, 0.06);
            border: 1px solid var(--border-glow);
            color: var(--text-secondary);
        }
        .project-card .proj-desc {
            font-size: 0.88rem;
            color: var(--text-secondary);
            flex: 1;
        }
        .project-card .proj-desc ul {
            list-style: none;
            padding-left: 0;
            margin-top: 4px;
        }
        .project-card .proj-desc ul li {
            position: relative;
            padding-left: 16px;
            margin-top: 2px;
            font-size: 0.84rem;
        }
        .project-card .proj-desc ul li::before {
            content: "·";
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: 700;
        }
        .project-card .proj-meta {
            margin-top: 12px;
            font-size: 0.78rem;
            color: var(--text-secondary);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
        }
        .project-card .proj-meta .tag-result {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            padding: 0 14px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.65rem;
            display: inline-flex;
            align-items: center;
            height: 24px;
            box-shadow: 0 0 24px var(--primary-glow);
        }

        /* ===== Skills ===== */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 16px;
        }
        .skill-group {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-glow);
            padding: 16px 18px;
            transition: all 0.35s ease;
            backdrop-filter: blur(4px);
        }
        .skill-group:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 32px var(--primary-glow);
        }
        .skill-group .sg-title {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--primary);
            margin-bottom: 8px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        /* (legacy .sg-items / .skill-tag 已替换为进度条样式，见下方 Dynamic 区段) */

        /* ===== Education & Awards ===== */
        .edu-awards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        @media (max-width: 720px) {
            .edu-awards-grid {
                grid-template-columns: 1fr;
            }
        }

        .edu-block {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-glow);
            padding: 20px 24px;
            backdrop-filter: blur(4px);
            transition: border-color 0.3s ease;
        }
        .edu-block:hover {
            border-color: var(--primary);
        }
        .edu-block .edu-school {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-primary);
        }
        .edu-block .edu-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .edu-block .edu-detail {
            font-size: 0.9rem;
            margin-top: 8px;
            color: var(--text-secondary);
        }
        .edu-block .edu-detail strong {
            color: var(--text-primary);
        }
        .edu-block .edu-courses {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
            margin-top: 8px;
        }
        .edu-block .edu-courses span {
            font-size: 0.72rem;
            padding: 2px 12px;
            border-radius: 40px;
            background: rgba(0, 212, 255, 0.06);
            border: 1px solid var(--border-glow);
            color: var(--text-secondary);
        }

        .awards-list {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-glow);
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            backdrop-filter: blur(4px);
            transition: border-color 0.3s ease;
        }
        .awards-list:hover {
            border-color: var(--primary);
        }
        .awards-list .award-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.88rem;
            flex-wrap: wrap;
            gap: 4px 8px;
        }
        .awards-list .award-item:last-child {
            border-bottom: none;
        }
        .awards-list .award-item .award-name {
            font-weight: 500;
            color: var(--text-primary);
        }
        .awards-list .award-item .award-year {
            font-size: 0.72rem;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .awards-list .award-item .award-desc {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: block;
            width: 100%;
        }

        /* ===== Certificates (新增) ===== */
        .cert-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        @media (max-width: 820px) {
            .cert-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 520px) {
            .cert-grid {
                grid-template-columns: 1fr;
            }
        }

        .cert-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-glow);
            padding: 20px 18px;
            transition: all 0.4s ease;
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;

        function renderHighlights() {
            const grid = $('#highlightsGrid');
            grid.innerHTML = resume.highlights.map((h, i) => {
                const parsed = parseHighlightNumber(h.number);
                return `<div class="highlight-card">
              <div class="number" data-idx="${i}"
                   data-prefix="${parsed.prefix}"
                   data-target="${parsed.target}"
                   data-suffix="${parsed.suffix}">${parsed.prefix}0${parsed.suffix}</div>
              <div class="label">${h.label}</div>
            </div>`;
            }).join('');

            // 数字滚动动画：进入视口后触发
            const cards = $$('#highlightsGrid .highlight-card .number');
            if (cards.length === 0) return;
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(e => {
                    if (e.isIntersecting) {
                        cards.forEach((el, idx) => {
                            if (reduceMotion) {
                                const d = el.dataset;
                                el.textContent = `${d.prefix}${d.target}${d.suffix}`;
                            } else {
                                animateHighlightNumber(el, idx * 80);
                            }
                        });
                        observer.disconnect();
                    }
                });
            }, { threshold: 0.3 });
            const target = $('#highlightsGrid');
            if (target) observer.observe(target);
        }

        // 把 "前5%" / "50+" / "83%" 解析为 prefix/target/suffix
        function parseHighlightNumber(raw) {
            const m = String(raw).match(/^([^\d]*)(\d+)([^\d]*)$/);
            if (m) return { prefix: m[1], target: parseInt(m[2], 10), suffix: m[3] };
            return { prefix: '', target: 0, suffix: String(raw) };
        }

        // 单个数字滚动（easeOutCubic）
        function animateHighlightNumber(el, delay) {
            const d = el.dataset;
            const target = parseInt(d.target, 10) || 0;
            const prefix = d.prefix || '';
            const suffix = d.suffix || '';
            const duration = 1100;
            const start = performance.now() + (delay || 0);
            function tick(now) {
                if (now < start) { requestAnimationFrame(tick); return; }
                const t = Math.min((now - start) / duration, 1);
                const eased = 1 - Math.pow(1 - t, 3);
                const val = Math.round(target * eased);
                el.textContent = `${prefix}${val}${suffix}`;
                if (t < 1) requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        }

        // 项目搜索 + 技术栈筛选
        let projSearchKey = '';
        let projActiveStack = 'all';

        function initProjectFilter(tabs, panels) {
            const chipsEl = $('#projChips');
            const searchInput = $('#projSearch');
            if (!chipsEl || !searchInput) return;

            // 提取所有技术栈，去重
            const allStacks = [...new Set(resume.projects.flatMap(p => p.stack))];
            chipsEl.innerHTML = `<button class="chip active" data-stack="all">全部</button>` +
                allStacks.map(s => `<button class="chip" data-stack="${s}">${s}</button>`).join('');

            // 搜索框：输入即过滤
            searchInput.addEventListener('input', (e) => {
                projSearchKey = e.target.value;
                applyProjectFilter(tabs, panels);
            });

            // chips：点击切换
            chipsEl.addEventListener('click', (e) => {
                if (!e.target.classList.contains('chip')) return;
                chipsEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                projActiveStack = e.target.dataset.stack;
                applyProjectFilter(tabs, panels);
            });
        }

        function applyProjectFilter(tabs, panels) {
            const key = projSearchKey.toLowerCase();
            const noResult = $('#projNoResult');
            let firstVisibleIdx = -1;

            tabs.forEach((tab, idx) => {
                const proj = resume.projects[idx];
                const matchStack = projActiveStack === 'all' || proj.stack.includes(projActiveStack);
                const matchSearch = !key ||
                    proj.title.toLowerCase().includes(key) ||
                    proj.stack.some(s => s.toLowerCase().includes(key)) ||
                    (proj.desc || []).some(d => d.toLowerCase().includes(key)) ||
                    (proj.result || '').toLowerCase().includes(key);
                const visible = matchStack && matchSearch;
                tab.style.display = visible ? '' : 'none';
                if (visible && firstVisibleIdx === -1) firstVisibleIdx = idx;
            });

            // 当前激活的 tab 被过滤掉了：切换到第一个可见项
            const activeTab = tabs.find(t => t.getAttribute('aria-selected') === 'true');
            if (activeTab && activeTab.style.display === 'none' && firstVisibleIdx !== -1) {
                tabs.forEach(t => { t.setAttribute('aria-selected', 'false'); t.tabIndex = -1; });
                panels.forEach(p => p.setAttribute('aria-hidden', 'true'));
                tabs[firstVisibleIdx].setAttribute('aria-selected', 'true');
                tabs[firstVisibleIdx].tabIndex = 0;
                panels[firstVisibleIdx].setAttribute('aria-hidden', 'false');
            }

            // 隐藏不可见项目的 panel（保持显示一致）
            panels.forEach((panel, idx) => {
                if (tabs[idx].style.display === 'none') {
                    panel.style.display = 'none';
                } else {
                    panel.style.display = '';
                }
            });

            if (noResult) noResult.style.display = firstVisibleIdx === -1 ? 'block' : 'none';
        }

                    if (e.isIntersecting) {
                        fills.forEach((fill, i) => {

            if (level.includes('掌握')) return 75;
            if (level.includes('阅读')) return 70;
            if (level.includes('基础')) return 50;
            return 60;

            const btn = $('#backTop');
            window.addEventListener('scroll', () => {
                const y = window.scrollY;
                btn.classList.toggle('visible', y > 400);
            });
            btn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        /* ============================================================
           NAV ACTIVE
           ============================================================ */
        function initNavActive() {
            const links = $$('[data-nav]');
            const sections = ['hero', 'highlights', 'experiences', 'projects', 'skills', 'edu-cert', 'interests'];
            const observer = new IntersectionObserver((entries) => {
                let activeId = 'hero';
                for (const e of entries) {
                    if (e.isIntersecting) {
                        activeId = e.target.id;
                        break;
                    }
                }
                links.forEach(link => {
                    const href = link.getAttribute('href').replace('#', '');
                    link.classList.toggle('active', href === activeId);
                });
            }, { threshold: 0.30, rootMargin: '-20px 0px -20px 0px' });
            sections.forEach(id => {
                const el = document.getElementById(id);
                if (el) observer.observe(el);
            });
        }

        /* ============================================================
           PRINT
           ============================================================ */
        function initPrint() {
            $('#printBtn').addEventListener('click', () => {
                window.print();
            });
        }

        /* ============================================================
           DYNAMIC: NAVBAR CLOCK
           ============================================================ */
        const SESSION_START = Date.now();
        function pad(n) { return String(n).padStart(2, '0'); }

        function initClock() {
            const clockEl = $('#navClock');
            if (!clockEl) return;
            function update() {
                const now = new Date();
                const week = ['日','一','二','三','四','五','六'][now.getDay()];
                clockEl.textContent =
                    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())} 周${week}`;
            }
            update();
            setInterval(update, 1000);
        }

        /* ============================================================
           DYNAMIC: VISIT STATS (localStorage)
           ============================================================ */
        const VISIT_KEY = 'resume_visit_stats';
        function loadVisitStats() {
            try { return JSON.parse(localStorage.getItem(VISIT_KEY) || '{}'); }
            catch { return {}; }
        }
        function saveVisitStats(s) { localStorage.setItem(VISIT_KEY, JSON.stringify(s)); }

        function bumpVisit() {
            const s = loadVisitStats();
            s.count = (s.count || 0) + 1;
            s.firstVisit = s.firstVisit || Date.now();
            s.lastVisit = Date.now();
            saveVisitStats(s);
            return s;
        }

        function daysAgo(ts) {
            if (!ts) return 0;
            return Math.floor((Date.now() - ts) / 86400000);
        }

        function initVisitStats() {
            const wrap = $('#visitStats');
            if (!wrap) return;
            const s = bumpVisit();

            function fmtDate(ts) {
                if (!ts) return '—';
                const d = new Date(ts);
                return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
            }
            function fmtDuration(sec) {
                const m = Math.floor(sec / 60);
                const h = Math.floor(m / 60);
                if (h > 0) return `${h}时${m % 60}分`;
                return `${m}分${sec % 60}秒`;
            }

            function render() {
                const onlineSec = Math.floor((Date.now() - SESSION_START) / 1000);
                wrap.innerHTML = `
                    <div class="stat-item">
                        <div class="stat-value">${s.count}</div>
                        <div class="stat-label">📊 累计访问次数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${daysAgo(s.firstVisit)}</div>
                        <div class="stat-label">📅 首次到访（天前）</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${fmtDate(s.lastVisit)}</div>
                        <div class="stat-label">🕐 上次访问</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="onlineDuration">${fmtDuration(onlineSec)}</div>
                        <div class="stat-label">⏱ 本次在线时长</div>
                    </div>
                `;
            }
            render();
            setInterval(render, 1000);
        }

        /* ============================================================
           DYNAMIC: COUNTDOWN TO ENROLLMENT
           ============================================================ */
        function initCountdown() {
            const el = $('#countdown');
            if (!el) return;
            // 从 resume.education.rank 推断目标日期；如不能识别则用 2026-09-01
            const target = new Date('2026-09-01T00:00:00');

            function render() {
                const now = new Date();
                const diff = target - now;
                const days = Math.max(0, Math.floor(diff / 86400000));
                const hours = Math.max(0, Math.floor((diff % 86400000) / 3600000));
                const mins = Math.max(0, Math.floor((diff % 3600000) / 60000));
                const expired = diff <= 0;
                el.innerHTML = expired ? `
                    <div class="cd-label">🎓 已入学</div>
                    <div class="cd-target">📅 2026-09-01 · 浙江工业大学</div>
                ` : `
                    <div class="cd-label">距浙江工业大学 2026 秋季入学还有</div>
                    <div>
                        <span class="cd-days">${days}</span><span class="cd-unit">天</span>
                        <span class="cd-days" style="font-size:1.8rem;">${pad(hours)}</span><span class="cd-unit">时</span>
                        <span class="cd-days" style="font-size:1.8rem;">${pad(mins)}</span><span class="cd-unit">分</span>
                    </div>
                    <div class="cd-target">📅 目标日期：2026-09-01（如需修改请告知）</div>
                `;
            }
            render();
            setInterval(render, 60000);
        }

        /* ============================================================
           INIT
           ============================================================ */
        document.addEventListener('DOMContentLoaded', () => {
            renderContact();
            renderHeroTags();
            renderHighlights();
            renderExperiences();
            renderProjects();
            renderSkills();
            renderEducation();
            renderAwards();
            renderCertificates();
            renderInterests();

            initTheme();
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            initBackTop();
            initNavActive();
            initPrint();
            initClock();
            initVisitStats();
            initCountdown();

            $$('[data-nav]').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const target = document.querySelector(link.getAttribute('href'));
                    if (target) target.scrollIntoView({ behavior: 'smooth' });
                });
            });
        });
    </script>

</body>
</html>
